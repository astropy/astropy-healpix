name: Publish

on:
  schedule:
    # run every day at 4am UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  publish:
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'Build wheels'))
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish.yml@afacbe8ebafa67b369e1f605b4f6989284ba2e87  # v2.6.5
    secrets:
      anaconda_token: ${{ secrets.anaconda_token }}
    with:
      upload_to_pypi: false
      save_artifacts: true
      targets: |
        - cp3*-manylinux_x86_64
        - cp3*-musllinux_x86_64
        - cp3*-win32
        - cp3*-win_amd64
        - cp3*-macosx_x86_64
        - cp3*-macosx_arm64
        - target: cp3*-manylinux_aarch64
          runs-on: ubuntu-24.04-arm

      # Developer wheels
      upload_to_anaconda: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
      anaconda_user: astropy
      anaconda_package: astropy-healpix
      anaconda_keep_n_latest: 10

  upload:
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/astropy-healpix
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') &&
          !endsWith(github.ref, '.dev') &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch'
          )
      }}
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
